[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "iam_rolesanywhere_session"

version = "2.3.0"

authors = [
    {name = "Thomas Buatois", email = "tbuatois@amazon.fr"},
]

description = "Boto3 session creator for IAM Roles Anywhere"

keywords = ["iam", "aws", "rolesanywhere", "boto3", "botocore"]

# PEP 639: SPDX expression plus project-level license-files. Both require
# setuptools>=77, and replace the deprecated license table, the
# "License :: OSI Approved" classifier and tool.setuptools.license-files.
license = "Apache-2.0"
license-files = ["LICENSE"]

requires-python = ">=3.9"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "boto3>=1.24.55",
    "botocore>=1.27.55",
    "cryptography>=37.0.4",
]

dynamic = [ "readme"]

[project.optional-dependencies]
dev = [
    "mkdocs",
    "mkdocs-material>=9.5.32",
    "mkdocstrings",
    "mkdocstrings-python",
    "pre-commit",
    "pymdown-extensions",
    "pytest",
]

[project.urls]
documentation = "https://awslabs.github.io/iam-rolesanywhere-session/"
repository = "https://github.com/awslabs/iam-roles-anywhere-session.git"
changelog = "https://github.com/awslabs/iam-roles-anywhere-session/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.package-data]
# PEP 561 marker, so type checkers honour the inline annotations.
iam_rolesanywhere_session = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
]
